name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: node --check skills/renoise-setup/scripts/install-cli.mjs
      - run: npm pack --dry-run
      - run: cd skills && npm pack --dry-run
